server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # El nombre "backend" se resuelve EN CADA PETICION, no una sola vez al
    # arrancar.
    #
    # Con `proxy_pass http://backend:5051;` a secas, nginx resuelve el nombre al
    # cargar la configuracion y se queda con esa IP para siempre. El 04/08/2026 el
    # frontend arranco 14 segundos ANTES que el backend: nginx se quedo con una
    # direccion muerta y todo /api devolvia 502 — el panel cargaba pero nadie podia
    # entrar, con el backend perfectamente sano al lado. Y no se arreglaba solo:
    # aguanto asi seis horas.
    #
    # Dos cosas lo evitan:
    #   - `resolver 127.0.0.11` es el DNS interno de Docker, el que sabe donde esta
    #     cada contenedor. `valid=10s` es cada cuanto se vuelve a preguntar.
    #   - poner la direccion en una VARIABLE obliga a nginx a resolverla en cada
    #     peticion en vez de al arrancar. Sin la variable, el `resolver` no se usa.
    #
    # Asi el orden de arranque deja de importar, y un backend que se recrea (y
    # cambia de IP) se vuelve a encontrar solo en diez segundos.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Los eventos en vivo (SSE) van por aqui y NO se pueden guardar en buffer:
    # nginx los retendria esperando a juntar unos cuantos, y el navegador no se
    # enteraria de nada hasta que se llenara el buffer o cerrara la conexion —
    # que es justo lo contrario de "en vivo". Tampoco valen los tiempos de
    # espera cortos: una conexion de eventos esta callada a proposito entre
    # aviso y aviso.
    location /api/refresh/stream {
        set $destino_stream http://backend:5051;
        proxy_pass $destino_stream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location /api {
        set $destino_backend http://backend:5051;
        proxy_pass $destino_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
